<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}FTE Location Planner{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">FTE Location &amp; Workforce Planner</a>
    <nav class="navlinks">
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Home</a>
      <a href="/dashboard" class="{% if request.url.path == '/dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/mapping" class="{% if request.url.path == '/mapping' %}active{% endif %}">Location Mapping</a>
      <a href="/analysis" class="{% if request.url.path == '/analysis' %}active{% endif %}">FTE Analysis</a>
      <a href="/transfer" class="{% if request.url.path == '/transfer' %}active{% endif %}">Transfer Mapping</a>
      <a href="/data-quality" class="{% if request.url.path == '/data-quality' %}active{% endif %}">Data Quality</a>
      <a href="/management" class="{% if request.url.path == '/management' %}active{% endif %}">Management View</a>
    </nav>
  </div>
</header>
<main class="page">
{% block content %}{% endblock %}
</main>
<footer class="footer">FTE Location Mapping &amp; Workforce Planning Tool</footer>
<script src="/static/js/app.js?v=2"></script>
{% block scripts %}{% endblock %}
</body>
</html>
